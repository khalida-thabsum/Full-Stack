<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Arrays and Functions</title>
  <style>
    body { margin: 0; font-family: "Segoe UI", sans-serif; display: flex; min-height: 100vh; background: #fdfaf3; }
    #tabs { width: 240px; background: #33261d; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
    #tabs button { text-align: left; background: transparent; color: #e8dccb; border: 1px solid transparent; padding: 8px 10px; cursor: pointer; font: inherit; }
    #tabs button:hover { border-color: #b88b4a; }
    #tabs button.on { background: #b88b4a; color: #fff; }
    main { flex: 1; padding: 24px 32px; }
    h1 { margin-top: 0; color: #33261d; }
    pre { background: #fff; border: 1px solid #e3d7c3; padding: 18px; font-size: 0.95rem; white-space: pre-wrap; }
    @media (max-width: 640px) { body { flex-direction: column; } #tabs { width: auto; } }
  </style>
</head>
<body>
  <nav id="tabs"></nav>
  <main>
    <h1>Arrays and Functions</h1>
    <pre id="out"></pre>
  </main>
  <script src="main.js"></script>
</body>
</html>
